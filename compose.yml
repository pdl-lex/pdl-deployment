services:
  mongodb:
    image: mongo:8
    container_name: pdl-mongodb
    env_file:
      - ".env"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pdl-network
      - lexoterm-network
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2.5G"
        reservations:
          cpus: "1.5"
          memory: "2.5G"
  lexoterm-static:
    image: nginx:1.27-alpine
    container_name: lexoterm-static
    restart: unless-stopped
    volumes:
      - /wb/static:/usr/share/nginx/html:ro
      - ./conf/nginx-static.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lexoterm-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=lexoterm-network
      - traefik.http.routers.lexoterm-static.rule=Host(`ba00000-lex.srv.mwn.de`,`azlex.de`,`lexoterm.de`) && PathPrefix(`/static`)
      - traefik.http.routers.lexoterm-static.entrypoints=websecure
      - traefik.http.routers.lexoterm-static.tls=true
      - traefik.http.routers.lexoterm-static.priority=100
      - traefik.http.routers.lexoterm-static.middlewares=lexoterm-static-strip
      - traefik.http.middlewares.lexoterm-static-strip.stripprefix.prefixes=/static
      - traefik.http.services.lexoterm-static.loadbalancer.server.port=80
  pdl-api:
    image: ghcr.io/pdl-lex/pdl-api:latest
    container_name: pdl-api
    env_file:
      - ".env"
    networks:
      - pdl-network
      - lexoterm-network
    depends_on:
      - mongodb
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=lexoterm-network
      - traefik.http.routers.pdl-api.rule=Host(`api.lexoterm.de`)
      - traefik.http.routers.pdl-api.entrypoints=websecure
      - traefik.http.routers.pdl-api.tls=true
      - traefik.http.services.pdl-api.loadbalancer.server.port=80
    command:
      [
        "uv",
        "run",
        "fastapi",
        "run",
        "app/main.py",
        "--proxy-headers",
        "--port",
        "80",
      ]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2.5G"
        reservations:
          cpus: "2"
          memory: "2.5G"
  pdl-platform:
    image: ghcr.io/pdl-lex/pdl-platform:latest
    container_name: pdl-platform
    env_file:
      - ".env"
    networks:
      - pdl-network
      - lexoterm-network
    depends_on:
      - pdl-api
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=lexoterm-network
      - traefik.http.routers.pdl-platform.rule=Host(`ba00000-lex.srv.mwn.de`,`azlex.de`,`lexoterm.de`)
      - traefik.http.routers.pdl-platform.entrypoints=websecure
      - traefik.http.routers.pdl-platform.tls=true
      - traefik.http.routers.pdl-platform.middlewares=pdl-platform-auth
      - traefik.http.middlewares.pdl-platform-auth.basicauth.users=adladmin:${BASIC_AUTH_PASSWORD}
      - traefik.http.services.pdl-platform.loadbalancer.server.port=3000
      - traefik.http.routers.lexoterm-www.rule=Host(`www.lexoterm.de`)
      - traefik.http.routers.lexoterm-www.entrypoints=websecure
      - traefik.http.routers.lexoterm-www.tls=true
      - traefik.http.routers.lexoterm-www.middlewares=lexoterm-www-redirect
      - traefik.http.routers.lexoterm-www.service=noop@internal
      - traefik.http.middlewares.lexoterm-www-redirect.redirectregex.regex=^https?://www\.lexoterm\.de/?(.*)
      - traefik.http.middlewares.lexoterm-www-redirect.redirectregex.replacement=https://lexoterm.de/$${1}
      - traefik.http.middlewares.lexoterm-www-redirect.redirectregex.permanent=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "1G"
  pdl-cms:
    image: ghcr.io/pdl-lex/pdl-cms:latest
    container_name: pdl-cms
    depends_on:
      - mongodb
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URL=${MONGODB_URI}
      - ALLOWED_ORIGIN=${CMS_ALLOWED_ORIGIN}
    restart: unless-stopped
    volumes:
      - payload-media:/app/media
    networks:
      - pdl-network
      - lexoterm-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=lexoterm-network
      - traefik.http.routers.pdl-cms.rule=Host(`cms.lexoterm.de`)
      - traefik.http.routers.pdl-cms.entrypoints=websecure
      - traefik.http.routers.pdl-cms.tls=true
      - traefik.http.services.pdl-cms.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "512M"
  pdl-smor-api:
    image: ghcr.io/pdl-lex/smor-api:latest
    container_name: pdl-smor-api
    environment:
      - SMOR_DEMO_URL=${SMOR_DEMO_URL}
    networks:
      - pdl-network
      - lexoterm-network
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=lexoterm-network
      - traefik.http.routers.pdl-smor-api.rule=Host(`smor.lexoterm.de`)
      - traefik.http.routers.pdl-smor-api.entrypoints=websecure
      - traefik.http.routers.pdl-smor-api.tls=true
      - traefik.http.services.pdl-smor-api.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "4G"
        reservations:
          cpus: "0.25"
          memory: "1G"
  pdl-wbf-nlp-demo:
    image: ghcr.io/pdl-lex/wbf-nlp-demo:latest
    container_name: wbf-nlp-demo
    networks:
      - pdl-network
      - lexoterm-network
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=lexoterm-network
      - traefik.http.routers.wbf-nlp-demo.rule=Host(`wbfdemo.lexoterm.de`)
      - traefik.http.routers.wbf-nlp-demo.entrypoints=websecure
      - traefik.http.routers.wbf-nlp-demo.tls=true
      - traefik.http.services.wbf-nlp-demo.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "512M"
networks:
  pdl-network:
    driver: bridge
  lexoterm-network:
    external: true
volumes:
  mongodb_data:
  payload-media:
  